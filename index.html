<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Management</title>
  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- separate CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="inventory-card">
    <!-- HEADER -->
    <header class="header">
      <h1><i class="fas fa-boxes"></i>Inventory Stocks</h1>
      <div class="header-actions">
        <button class="btn btn-outline btn-sm"><i class="fas fa-file-export"></i> Export</button>
        <button class="btn btn-primary"><i class="fas fa-plus-circle"></i> Add item</button>
      </div>
    </header>

    <!-- STATS -->
    <section class="stats-grid">
      <div class="stat-item">
        <div class="stat-icon"><i class="fas fa-cubes"></i></div>
        <div class="stat-content">
          <span class="stat-label">Total items</span>
          <span class="stat-number" id="totalItems">12</span>
        </div>
      </div>
      <div class="stat-item">
        <div class="stat-icon"><i class="fas fa-tags"></i></div>
        <div class="stat-content">
          <span class="stat-label">Categories</span>
          <span class="stat-number" id="totalCategories">4</span>
        </div>
      </div>
      <div class="stat-item">
        <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="stat-content">
          <span class="stat-label">Low stock</span>
          <span class="stat-number" id="lowStockCount">3</span>
        </div>
      </div>
      <div class="stat-item">
        <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
        <div class="stat-content">
          <span class="stat-label">Total value</span>
          <span class="stat-number" id="totalValue">$8,240</span>
        </div>
      </div>
    </section>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search products..." id="searchInput" />
      </div>
      <div class="filter-group">
        <button class="btn btn-outline btn-sm filter-btn active" data-filter="all"><i class="fas fa-list"></i> All</button>
        <button class="btn btn-outline btn-sm filter-btn" data-filter="electronics"><i class="fas fa-microchip"></i> Electronics</button>
        <button class="btn btn-outline btn-sm filter-btn" data-filter="furniture"><i class="fas fa-chair"></i> Furniture</button>
        <button class="btn btn-outline btn-sm filter-btn" data-filter="clothing"><i class="fas fa-tshirt"></i> Clothing</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table class="inventory-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Value</th>
            <th style="text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryBody">
          <!-- rows injected by JavaScript -->
        </tbody>
      </table>
    </div>

    <!-- FOOTER / PAGINATION (demo) -->
    <div class="table-footer">
      <span class="footer-info">Showing <strong id="showingCount">12</strong> items</span>
      <div class="pagination">
        <button class="btn btn-outline btn-sm"><i class="fas fa-chevron-left"></i></button>
        <button class="btn btn-primary btn-sm">1</button>
        <button class="btn btn-outline btn-sm">2</button>
        <button class="btn btn-outline btn-sm">3</button>
        <button class="btn btn-outline btn-sm"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
  </div>

  <!-- separate JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
